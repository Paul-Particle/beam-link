[project]
name = "beamlink"
version = "0.2.0"
description = "A physics engine for beamed microwave power to an aircraft, and the layers that read it"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.17.1",
    # viz/ only: plotly for the figures, contourpy to contour P5's emitted enclosed-energy field.
    # Neither is importable from physics/ — tests/test_import_firewall.py asserts it.
    "plotly",
    "contourpy",
]

[project.optional-dependencies]
# ITU-R propagation models, needed only to regenerate the atmosphere/spectrum tables
generators = [
    "itur",
    "astropy",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beamlink"]
