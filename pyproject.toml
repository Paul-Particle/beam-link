[project]
name = "beamlink"
version = "0.1.0"
description = "Link budget and first-pass economics for microwave power beaming to aircraft"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "scipy>=1.17.1",
    "contourpy",
]

[project.optional-dependencies]
# ITU-R propagation models, needed only to regenerate the atmosphere/spectrum tables
generators = [
    "itur",
    "astropy",
]
# winglet_validation draws its diagnostic overlays with matplotlib rather than plotly
validation = [
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beamlink"]
