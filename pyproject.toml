[project]
name = "mw-aviation-napkin"
version = "0.1.0"
description = "Napkin math for microwave-powered aviation envelope"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy",
    "pandas",
    "plotly",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
