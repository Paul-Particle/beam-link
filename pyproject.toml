[project]
name = "beamlink"
version = "0.1.0"
description = "Link budget and first-pass economics for microwave power beaming to aircraft"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "scipy>=1.17.1",
    "contourpy",
    # The plotly figures bake their heatmaps to PNG through matplotlib's colormaps
    # (beam_link_animation._field_to_png) — a core render path, not just a diagnostic.
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
# ITU-R propagation models, needed only to regenerate the atmosphere/spectrum tables
generators = [
    "itur",
    "astropy",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beamlink"]
